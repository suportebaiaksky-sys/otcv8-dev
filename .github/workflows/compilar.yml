name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependencias (vcpkg)
        run: |
          # Instalamos o Boost e componentes necessários via vcpkg
          vcpkg install boost-system boost-filesystem zlib libzip bzip2 glew openssl physfs luajit --triplet x86-windows-static --clean-after-build

      - name: Aplicar Opção 1 (Update Boost Version)
        shell: bash
        run: |
          # Altera a versão mínima de 1.67.0 para 1.90.0 conforme sua análise
          sed -i 's/find_package(Boost 1.67.0/find_package(Boost 1.90.0/g' src/framework/CMakeLists.txt

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # Forçamos o CMake a usar o modo de configuração do vcpkg para o Boost
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DBoost_NO_BOOST_CMAKE=OFF \
                   -DCMAKE_PREFIX_PATH="C:/vcpkg/installed/x86-windows-static"
          
          cmake --build . --config Release --parallel 4

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
