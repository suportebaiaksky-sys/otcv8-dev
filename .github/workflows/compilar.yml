name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Compilador Windows
        run: |
          sudo apt-get update
          # Instalando o MinGW oficial do repositório do Ubuntu (sempre online)
          sudo apt-get install -y mingw-w64 cmake
          sudo apt-get install -y libglew-dev libzip-dev libphysfs-dev libssl-dev

      - name: Compilar
        run: |
          mkdir build && cd build
          # Configura o CMake para usar o compilador de Windows que instalamos acima
          cmake .. -DCMAKE_SYSTEM_NAME=Windows \
                   -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
                   -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
                   -DOTC_COMPILE_STATIC=ON \
                   -G "Unix Makefiles"
          make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/otclient.exe
