name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Bibliotecas (vcpkg)
        run: |
          # Corrigido: glew (com G) em vez de blew
          vcpkg install glew zlib libzip openssl physfs luajit --triplet x86-windows-static

      - name: Configurar e Compilar
        shell: bash
        run: |
          mkdir build && cd build
          # Vincula o vcpkg ao CMake do seu projeto
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON
          cmake --build . --config Release

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
