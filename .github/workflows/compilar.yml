name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalação de Dependências (vcpkg)
        run: |
          vcpkg install boost-system boost-filesystem zlib libzip bzip2 glew openssl physfs luajit --triplet x86-windows-static --clean-after-build

      - name: Limpeza de Scripts e Trava de Versão
        shell: bash
        run: |
          # Mantendo as correções de ZLIB e LibZip que deram certo
          rm -f src/framework/cmake/FindBoost.cmake
          rm -f src/framework/cmake/FindZLIB.cmake
          rm -f src/framework/cmake/FindLibZip.cmake
          
          # Forçando o CMakeLists a aceitar qualquer versão do Boost (evita o erro da imagem b34d09)
          sed -i 's/find_package(Boost 1.67.0/find_package(Boost/g' src/framework/CMakeLists.txt

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # Adicionamos -DBoost_NO_BOOST_CMAKE=ON para ignorar o script que falhou na imagem dba8a4
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DBoost_NO_BOOST_CMAKE=ON \
                   -DCMAKE_BUILD_TYPE=Release
          
          cmake --build . --config Release --parallel 4

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
