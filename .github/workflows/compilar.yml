name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependencias (vcpkg)
        run: |
          # Instalamos o essencial para o OTCv8
          vcpkg install boost-system boost-filesystem zlib libzip bzip2 glew openssl physfs luajit --triplet x86-windows-static --clean-after-build

      - name: Remover Scripts de Busca Locais
        shell: bash
        run: |
          # Deletamos os scripts que estão forçando versões antigas ou caminhos errados
          find src/framework/cmake/ -name "FindBoost.cmake" -delete
          find src/framework/cmake/ -name "FindZLIB.cmake" -delete
          find src/framework/cmake/ -name "FindLibZip.cmake" -delete

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # CMAKE_POLICY_DEFAULT_CMP0074=NEW ajuda o CMake a preferir caminhos de pacotes modernos
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
                   -DBoost_NO_BOOST_CMAKE=OFF
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: |
            build/Release/otclient.exe
            build/otclient.exe
