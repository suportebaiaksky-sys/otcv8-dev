name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependencias Auxiliares
        run: |
          # Instalamos só o que não usa ZLIB para não corromper nada
          vcpkg install glew openssl physfs luajit --triplet x86-windows-static

      - name: Baixar ZLIB Manualmente
        shell: bash
        run: |
          # Baixamos a biblioteca direto do repositório oficial em binário
          curl -L https://github.com/madler/zlib/archive/refs/tags/v1.3.1.zip -o zlib.zip
          unzip zlib.zip
          mv zlib-1.3.1 external_zlib

      - name: Compilar com CMake (Modo Forçado)
        shell: bash
        run: |
          mkdir build && cd build
          # Aqui a gente aponta o CMake para a pasta que acabamos de baixar
          # Isso pula qualquer erro do vcpkg
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DUSE_SYSTEM_ZLIB=OFF \
                   -DZLIB_SOURCE_DIR="../external_zlib" \
                   -DZLIB_INCLUDE_DIR="../external_zlib" \
                   -DZLIB_LIBRARY="../external_zlib"
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
