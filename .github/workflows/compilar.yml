name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalação Limpa de Dependências
        run: |
          # Instalamos as bibliotecas necessárias via vcpkg
          vcpkg install boost-system boost-filesystem zlib libzip bzip2 glew openssl physfs luajit --triplet x86-windows-static --clean-after-build

      - name: Remover Bloqueios e Scripts Antigos
        shell: bash
        run: |
          # 1. Deletamos os scripts internos que causam os erros das suas imagens (ZLIB, LibZip e Boost)
          rm -f src/framework/cmake/FindBoost.cmake
          rm -f src/framework/cmake/FindZLIB.cmake
          rm -f src/framework/cmake/FindLibZip.cmake
          rm -f src/framework/cmake/FindBZip2.cmake
          
          # 2. Removemos a exigência de versão específica (1.67.0) que causa o erro de mismatch com a 1.90.0 do vcpkg
          sed -i 's/find_package(Boost 1.67.0/find_package(Boost/g' src/framework/CMakeLists.txt

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # O segredo é usar o toolchain do vcpkg sem interferência dos scripts locais removidos
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DCMAKE_BUILD_TYPE=Release
          
          cmake --build . --config Release --parallel 4

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
