name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependencias Auxiliares
        run: |
          # Instalamos apenas o que não costuma dar erro de link
          vcpkg install glew openssl physfs luajit --triplet x86-windows-static

      - name: Compilar com CMake (Forçando ZLIB Interna)
        shell: bash
        run: |
          mkdir build && cd build
          # O segredo aqui é o -DLUajit_INCLUDE_DIR e o desvio da ZLIB do vcpkg
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DUSE_SYSTEM_ZLIB=OFF \
                   -DUSE_SYSTEM_LIBZIP=OFF \
                   -DZLIB_INCLUDE_DIR="../src/framework/stdext" \
                   -DABORT_ON_MISSING_LIBS=OFF
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
