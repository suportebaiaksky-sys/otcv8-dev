name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalação de Dependências (vcpkg)
        run: |
          # Mantendo a base vitoriosa contra ZLIB e LibZip
          vcpkg install boost-system boost-filesystem zlib libzip bzip2 glew openssl physfs luajit --triplet x86-windows-static --clean-after-build

      - name: Limpeza e Ajuste Radical (sed)
        shell: bash
        run: |
          # Mantendo a remoção dos scripts conflitantes de 2018
          rm -f src/framework/cmake/FindBoost.cmake
          rm -f src/framework/cmake/FindZLIB.cmake
          rm -f src/framework/cmake/FindLibZip.cmake
          
          # Seu sed aprimorado: remove QUALQUER versão para evitar o mismatch da 1.90.0
          sed -i 's/find_package(Boost [^ ]* COMPONENTS/find_package(Boost COMPONENTS/g' src/framework/CMakeLists.txt

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # Adicionamos -DBoost_DEBUG=ON para vermos exatamente onde ele trava se falhar
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DCMAKE_BUILD_TYPE=Release \
                   -DBoost_NO_BOOST_CMAKE=ON \
                   -DBoost_NO_SYSTEM_PATHS=ON \
                   -DBOOST_ROOT="C:/vcpkg/installed/x86-windows-static" \
                   -DBOOST_LIBRARYDIR="C:/vcpkg/installed/x86-windows-static/lib" \
                   -DBoost_DEBUG=ON
          
          cmake --build . --config Release --parallel 4

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
