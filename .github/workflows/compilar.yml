name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalação Limpa (vcpkg)
        run: |
          # Instalamos apenas o necessário, garantindo que o vcpkg faça o trabalho pesado
          vcpkg install boost-system boost-filesystem zlib libzip bzip2 glew openssl physfs luajit --triplet x86-windows-static --clean-after-build

      - name: Compilar com CMake (Modo Manual)
        shell: bash
        run: |
          mkdir build && cd build
          # Aqui nós definimos os caminhos manualmente para o CMake não se perder
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DBoost_NO_BOOST_CMAKE=ON \
                   -DBOOST_ROOT="C:/vcpkg/installed/x86-windows-static" \
                   -DBOOST_LIBRARYDIR="C:/vcpkg/installed/x86-windows-static/lib" \
                   -DBOOST_INCLUDEDIR="C:/vcpkg/installed/x86-windows-static/include" \
                   -DZLIB_ROOT="C:/vcpkg/installed/x86-windows-static" \
                   -DLibZip_ROOT="C:/vcpkg/installed/x86-windows-static"
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
