name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependencias (vcpkg)
        run: |
          # Instalando tudo o que é necessário para o motor gráfico e compressão
          vcpkg install glew openssl physfs luajit zlib libzip --triplet x86-windows-static

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # Forçamos o CMake a encontrar as ferramentas do vcpkg e desativamos buscas automáticas que falham
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DCOMPILER_OPTIMIZATION=OFF \
                   -DUSE_SYSTEM_ZLIB=ON \
                   -DUSE_SYSTEM_LIBZIP=ON
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
