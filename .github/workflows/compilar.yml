name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependencias (vcpkg)
        run: |
          # Instalamos os pacotes necessários
          vcpkg install boost-system boost-filesystem zlib libzip bzip2 glew openssl physfs luajit --triplet x86-windows-static --clean-after-build

      - name: Remover Scripts de Busca Conflitantes
        shell: bash
        run: |
          # Removemos os scripts internos que causam o erro de 'exit code 1'
          rm -f src/framework/cmake/FindBoost.cmake
          rm -f src/framework/cmake/FindZLIB.cmake
          rm -f src/framework/cmake/FindLibZip.cmake

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # O segredo agora é deixar o vcpkg tomar conta de tudo sem interferência
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DCMAKE_BUILD_TYPE=Release
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: |
            build/Release/otclient.exe
            build/otclient.exe
