name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Faxina e Instalação (vcpkg)
        run: |
          # O segredo: --recurse e --clean-after-build para deletar arquivos corrompidos
          vcpkg install zlib libzip glew openssl physfs luajit bzip2 --triplet x86-windows-static --recurse --clean-after-build

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # Forçamos o CMake a usar os arquivos reais, pulando o "wrapper" quebrado
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DZLIB_USE_STATIC_LIBS=ON \
                   -DUSE_SYSTEM_ZLIB=ON
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
