name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Limpar e Instalar Dependencias (vcpkg)
        run: |
          # 1. Removemos a instalação quebrada conforme sua análise
          vcpkg remove zlib:x86-windows-static --recurse
          
          # 2. Instalamos TUDO do zero, incluindo o Boost necessário
          vcpkg install boost-system boost-filesystem zlib libzip bzip2 glew openssl physfs luajit --triplet x86-windows-static --clean-after-build

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # Passamos o Toolchain do vcpkg para que o CMake encontre o Boost e a Zlib
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DZLIB_USE_STATIC_LIBS=ON
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
