name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg software-properties-common cmake
          
          # Baixa e prepara a chave do repositório MXE no novo formato
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://pkg.mxe.cc/repos/apt/conf/mxe.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/mxe.gpg
          
          # Adiciona o repositório apontando para a chave específica
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/mxe.gpg] http://pkg.mxe.cc/repos/apt/focal main" | sudo tee /etc/apt/sources.list.d/mxe.list
          
          sudo apt-get update
          
          # Instala os pacotes do compilador
          sudo apt-get install -y mxe-i686-w64-mingw32.static-boost \
                                 mxe-i686-w64-mingw32.static-glew \
                                 mxe-i686-w64-mingw32.static-libzip \
                                 mxe-i686-w64-mingw32.static-physfs \
                                 mxe-i686-w64-mingw32.static-openssl \
                                 mxe-i686-w64-mingw32.static-luajit

      - name: Compilar
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/usr/lib/mxe/usr/i686-w64-mingw32.static/share/cmake/mxe-conf.cmake -DOTC_COMPILE_STATIC=ON -G "Unix Makefiles"
          make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/otclient.exe
