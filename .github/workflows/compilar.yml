name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar MSVC
        uses: microsoft/setup-msbuild@v1.3

      - name: Instalar Dependencias Estáveis
        run: |
          # Instalando apenas o básico via vcpkg para evitar quebras
          vcpkg install glew openssl physfs luajit --triplet x86-windows-static

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # Ignoramos a ZLIB externa para usar a que já vem dentro da pasta 'src' do OTCv8
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DUSE_SYSTEM_ZLIB=OFF
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
