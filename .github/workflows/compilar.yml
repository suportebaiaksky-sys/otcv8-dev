name: Compilar Cliente
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependências Completas
        run: |
          # Instalamos o pacote completo para evitar o erro de BZip2 e ZLIB
          vcpkg install glew openssl physfs luajit zlib bzip2 libzip --triplet x86-windows-static

      - name: Compilar com CMake
        shell: bash
        run: |
          mkdir build && cd build
          # O segredo é usar o CMAKE_TOOLCHAIN_FILE para o vcpkg gerenciar todas as bibliotecas sozinho
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                   -DVCPKG_TARGET_TRIPLET=x86-windows-static \
                   -DOTC_COMPILE_STATIC=ON \
                   -DCOMPILER_OPTIMIZATION=OFF
          
          cmake --build . --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows
          path: build/Release/otclient.exe
